server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: stock-watcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  config:
    import: classpath:application-secret.properties
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 180000
      keepalive-time: 10000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  task:
    scheduling:
      pool:
        size: 4

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.arthur.stock.model
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

# ========== Python Compute Service ==========
python:
  compute:
    url: http://127.0.0.1:8085

# ========== Tushare API Configuration ==========
# 真实 token 请填写在 application-secret.properties 中，避免提交到版本控制
tushare:
  token: ${tushare.token}
  base-url: http://api.tushare.pro
  timeout: 30000
  rate-limit:
    daily:
      permits-per-minute: 500
    stock_basic:
      permits-per-minute: 500
    trade_cal:
      permits-per-minute: 500
    adj_factor:
      permits-per-minute: 200
    dividend:
      permits-per-minute: 180
    index_weight:
      permits-per-minute: 200
    index_basic:
      permits-per-minute: 500
    index_classify:
      permits-per-minute: 200
    index_member_all:
      permits-per-minute: 200
    namechange:
      permits-per-minute: 200
    suspend_d:
      permits-per-minute: 200
    stk_limit:
      permits-per-minute: 180
    income:
      permits-per-minute: 200
    balancesheet:
      permits-per-minute: 200
    cashflow:
      permits-per-minute: 200
    forecast:
      permits-per-minute: 200
    express:
      permits-per-minute: 190
    index_daily:
      permits-per-minute: 500
    top_list:
      permits-per-minute: 180
    top_inst:
      permits-per-minute: 180
    moneyflow:
      permits-per-minute: 180
    daily_basic:
      permits-per-minute: 180
    block_trade:
      permits-per-minute: 180
    hk_hold:
      permits-per-minute: 180
    margin:
      permits-per-minute: 180
    margin_detail:
      permits-per-minute: 180
    stk_holdertrade:
      permits-per-minute: 180
    stk_holdernumber:
      permits-per-minute: 180

# ========== Auth Configuration ==========
auth:
  admin-skip-totp: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always